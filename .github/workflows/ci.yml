name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 1. Validate Go Backend ──────────────────────────────────────
  validate-go:
    name: Test & Build Go Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: src/go.sum

      - name: Install SQLite3 development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Verify Go Module dependencies
        working-directory: src
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || true

      - name: Build Go Server Binary
        working-directory: src
        run: |
          CGO_ENABLED=1 GOOS=linux go build -ldflags="-w -s" -o ../AdhocServer .

  # ── 2. Validate Next.js Webapp ──────────────────────────────────
  validate-webapp:
    name: Test & Build Next.js Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        working-directory: webapp
        run: npx prisma generate

      - name: Build Next.js Webapp (Typecheck & Compile)
        working-directory: webapp
        run: npm run build

  # ── 3. Build & Publish Multi-Arch Docker Image ──────────────────
  docker-delivery:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    needs: [validate-go, validate-webapp]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata & tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Docker image (amd64 & arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
